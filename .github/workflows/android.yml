name: Compilar APK Android

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Configurar Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del proyecto
        run: npm install

      - name: Sincronizar Capacitor y generar entorno Android
        run: |
          npx cap sync android || npx cap add android

      - name: Construir proyecto Android con Gradle
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Guardar el APK generado
        uses: actions/upload-artifact@v4
        with:
          name: app-gps-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
